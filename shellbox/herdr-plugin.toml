id = "studykit.shellbox"
name = "shellbox"
version = "0.6.0"
min_herdr_version = "0.9.0"
description = "Show or hide a persistent shell popup for each Herdr pane"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Shell: toggle popup"
description = "Show or hide the focused pane's shell popup"
contexts = ["workspace", "tab", "pane"]
command = ["./herdr_main.py", "open"]

[[panes]]
id = "shell"
title = "Shell"
placement = "popup"
width = "90%"
height = "85%"
command = ["./herdr_main.py", "panel"]

[[events]]
on = "pane.agent_detected"
command = ["./herdr_main.py", "agent-detected"]
