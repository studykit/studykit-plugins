id = "studykit.shellbox"
name = "shellbox"
version = "0.8.0"
min_herdr_version = "0.9.0"
description = "Show or hide a persistent shell popup for each Herdr pane"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Shell: toggle popup"
description = "Show or hide the focused pane's shell popup"
contexts = ["workspace", "tab", "pane"]
command = ["./herdr_main.py", "open"]

[[panes]]
id = "shell"
title = "Shell"
placement = "popup"
width = "90%"
height = "85%"
command = ["./herdr_main.py", "panel"]

[[panes]]
id = "confirm"
title = "Shell still running"
placement = "popup"
width = 72
height = 12
command = ["./herdr_main.py", "confirm"]

[[events]]
on = "pane.agent_detected"
command = ["./herdr_main.py", "agent-detected"]

[[events]]
on = "pane.closed"
command = ["./herdr_main.py", "pane-closed"]

[[events]]
on = "pane.exited"
command = ["./herdr_main.py", "pane-closed"]
