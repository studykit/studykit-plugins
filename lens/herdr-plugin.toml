id = "studykit.lens"
name = "Lens"
version = "0.25.0"
min_herdr_version = "0.9.0"
description = "Browse files, Git changes, and commit history, and send line comments to agents"
platforms = ["linux", "macos"]

[[actions]]
id = "browse"
title = "Files: browse project"
description = "Open a file tree rooted at the focused pane's working directory"
contexts = ["workspace", "tab", "pane"]
command = ["./herdr_main.py", "browse"]

[[actions]]
id = "toggle"
title = "Files: toggle Lens"
description = "Open Lens, or close it when it is already open"
contexts = ["workspace", "tab", "pane"]
command = ["./herdr_main.py", "toggle"]

[[actions]]
id = "changes"
title = "Files: browse changes"
description = "Search changed files and preview their Git diff"
contexts = ["workspace", "tab", "pane"]
command = ["./herdr_main.py", "changes"]

[[panes]]
id = "navigator"
title = "Lens"
placement = "overlay"
command = ["./herdr_main.py", "panel"]

[[panes]]
id = "popup"
title = "Lens"
placement = "popup"
width = "96%"
height = "92%"
command = ["./herdr_main.py", "panel"]
